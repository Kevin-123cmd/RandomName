<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>随机姓名生成器</title>
<style>
  :root {
    --bg: #fafafa; --card: #ffffff; --card-fg: #09090b;
    --primary: #18181b; --primary-fg: #fafafa; --primary-hover: #27272a;
    --secondary: #f4f4f5; --secondary-fg: #18181b; --muted-fg: #71717a;
    --border: #e4e4e7; --radius: 10px; --radius-sm: 7px;
    --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05); --ok: #16a34a;
  }
  [data-theme="dark"] {
    --bg: #09090b; --card: #121215; --card-fg: #fafafa;
    --primary: #fafafa; --primary-fg: #18181b; --primary-hover: #e4e4e7;
    --secondary: #27272a; --secondary-fg: #fafafa; --muted-fg: #a1a1aa;
    --border: #27272a;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg); color: var(--card-fg); line-height: 1.5;
    -webkit-font-smoothing: antialiased; min-height: 100vh; padding: 16px;
  }
  .container { width: 100%; max-width: 520px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .title { display: flex; align-items: center; gap: 10px; }
  .title h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .title .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--primary); color: var(--primary-fg); display: flex; align-items: center; justify-content: center; }
  .icon-btn { width: 34px; height: 34px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card); color: var(--card-fg); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background .15s ease; }
  .icon-btn:hover { background: var(--secondary); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 16px; margin-bottom: 14px; }
  .card-title { font-size: 13px; font-weight: 600; color: var(--muted-fg); margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 7px; }
  input[type="number"] { width: 100%; height: 40px; padding: 0 12px; font-size: 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--card-fg); outline: none; }
  input[type="number"]:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--secondary); }
  .btn-primary { width: 100%; height: 48px; font-size: 15px; font-weight: 600; background: var(--primary); color: var(--primary-fg); border: 1px solid var(--primary); border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all .15s ease; }
  .btn-primary:hover { background: var(--primary-hover); opacity: .96; }
  .btn-primary:active { transform: scale(.99); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .btn-sm { height: 30px; padding: 0 11px; font-size: 12px; font-weight: 500; border: 1px solid var(--border); background: var(--card); color: var(--card-fg); border-radius: var(--radius-sm); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: background .15s ease; }
  .btn-sm:hover { background: var(--secondary); }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .name-chip { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 9px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); font-size: 15px; cursor: pointer; transition: background .15s ease; -webkit-user-select: text; user-select: text; }
  .name-chip:hover { background: var(--secondary); }
  .name-chip .copy-ico { color: var(--muted-fg); opacity: 0; transition: opacity .12s; user-select: none; -webkit-user-select: none; }
  .name-chip:hover .copy-ico { opacity: 1; }
  .empty { text-align: center; color: var(--muted-fg); font-size: 13px; padding: 30px 10px; border: 1px dashed var(--border); border-radius: var(--radius-sm); }
  footer { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted-fg); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--primary); color: var(--primary-fg); font-size: 13px; font-weight: 500; padding: 9px 16px; border-radius: 9999px; box-shadow: 0 6px 22px rgba(0,0,0,.22); opacity: 0; pointer-events: none; transition: all .22s ease; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .manual-copy { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); z-index: 60; padding: 20px; }
  .manual-copy.show { display: flex; }
  .manual-copy .mc-panel { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .manual-copy .mc-title { font-size: 14px; font-weight: 600; color: var(--fg); margin-bottom: 10px; }
  .manual-copy .mc-text { width: 100%; height: 120px; resize: none; box-sizing: border-box; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; font-size: 15px; line-height: 1.5; background: var(--bg); color: var(--fg); }
  .manual-copy .mc-close { margin-top: 12px; width: 100%; padding: 10px; border: none; border-radius: var(--radius-sm); background: var(--primary); color: var(--primary-fg); font-size: 14px; font-weight: 500; cursor: pointer; }
  @media (max-width: 420px) { .results { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); } }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="title">
      <span class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </span>
      <h1>随机姓名生成器</h1>
    </div>
    <button class="icon-btn" id="themeToggle" title="切换主题" aria-label="切换主题">
      <svg id="themeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </header>

  <div class="card">
    <div class="card-title">设置</div>
    <div class="field">
      <label for="count">生成数量</label>
      <input type="number" id="count" min="0" max="500" value="20" inputmode="numeric" />
    </div>
  </div>

  <button class="btn-primary" id="generateBtn">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
    生成姓名

  <div class="card" style="margin-top:14px;">
    <div class="toolbar">
      <button class="btn-sm" id="copyAll">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        复制全部
      </button>
      <button class="btn-sm" id="shareBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        复制分享链接
      </button>
      <button class="btn-sm" id="clearBtn">清空</button>
    </div>
    <div class="results" id="results">
      <div class="empty">点击「生成姓名」开始</div>
    </div>
  </div>

  <footer>
    <div>随机姓名生成器 · 零依赖</div>
    <div id="footTime"></div>
  </footer>
</div>

<div class="toast" id="toast"></div>

let lastNames = [];

function randint(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 1600);
}

function generate() {
  const n = Math.max(0, Math.min(500, parseInt(document.getElementById('count').value) || 0));
  const out = [];
  for (let k = 0; k < n; k++) {
    const SurName = choice(SURNAMES);
    const i = randint(1, 2);
    let GivenName = "";
    for (let j = 1; j <= i; j++) GivenName += choice(CHARACTERS);
    out.push(SurName + GivenName);
  }
  lastNames = out;
  render(out);
  syncHash();
}

function render(names) {
  const box = document.getElementById('results');
  if (!names.length) { box.innerHTML = '<div class="empty">点击「生成姓名」开始</div>'; return; }
  box.innerHTML = names.map(n =>
    '<div class="name-chip" data-name="' + n + '"><span>' + n + '</span>' +
    '<svg class="copy-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></div>'
  ).join('');
}

function copyText(text) {
  return new Promise((resolve) => {
    // file:// 等非安全上下文:剪贴板权限无法持久化,任何 JS 写入都会反复弹窗且不记住
    // 直接交给调用点弹"长按复制"浮层,不触发权限申请
    if (!window.isSecureContext) { resolve(false); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      let settled = false;
      const timer = setTimeout(() => { if (!settled) { settled = true; resolve(legacyCopy(text)); } }, 700);
      navigator.clipboard.writeText(text)
        .then(() => { if (!settled) { settled = true; clearTimeout(timer); resolve(true); } })
        .catch(() => { if (!settled) { settled = true; clearTimeout(timer); resolve(legacyCopy(text)); } });
      return;
    }
    resolve(legacyCopy(text));
  });
}
function legacyCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0';
    ta.style.width = '100%'; ta.style.fontSize = '16px'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}
function showManualCopy(text) {
  let box = document.getElementById('manualCopy');
  if (!box) {
    box = document.createElement('div'); box.id = 'manualCopy'; box.className = 'manual-copy';
    box.innerHTML = '<div class="mc-panel"><div class="mc-title">请长按下方文本复制</div><textarea class="mc-text" readonly></textarea><button class="mc-close">关闭</button></div>';
    document.body.appendChild(box);
    box.querySelector('.mc-close').addEventListener('click', () => box.classList.remove('show'));
  }
  const t = box.querySelector('.mc-text'); t.value = text; t.focus(); t.select(); t.setSelectionRange(0, text.length);
  box.classList.add('show');
}

document.getElementById('results').addEventListener('click', (e) => {
  const chip = e.target.closest('.name-chip'); if (!chip) return;
  copyText(chip.dataset.name).then((ok) => { if (ok) toast('已复制：' + chip.dataset.name); else showManualCopy(chip.dataset.name); });
});
document.getElementById('copyAll').addEventListener('click', () => {
  if (!lastNames.length) return toast('还没有生成的姓名');
  copyText(lastNames.join('\n')).then((ok) => { if (ok) toast('已复制全部 ' + lastNames.length + ' 个姓名'); else showManualCopy(lastNames.join('\n')); });
});
document.getElementById('clearBtn').addEventListener('click', () => { lastNames = []; render([]); toast('已清空'); });
document.getElementById('shareBtn').addEventListener('click', () => {
  syncHash();
  copyText(location.href).then((ok) => { if (ok) toast('分享链接已复制'); else showManualCopy(location.href); });
});
document.getElementById('generateBtn').addEventListener('click', generate);

function syncHash() {
  const p = new URLSearchParams();
  p.set('n', Math.max(0, Math.min(500, parseInt(document.getElementById('count').value) || 0)));
  history.replaceState(null, '', '#' + p.toString());
}
(function loadHash() {
  const p = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (p.has('n')) document.getElementById('count').value = Math.max(0, Math.min(500, parseInt(p.get('n')) || 0));
})();

const themeToggle = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');
function applyTheme(dark) {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  themeIcon.innerHTML = dark
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
}
applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);
themeToggle.addEventListener('click', () => applyTheme(document.documentElement.getAttribute('data-theme') !== 'dark'));

document.getElementById('footTime').textContent = '更新于 ' + new Date().toISOString().slice(0, 10);
